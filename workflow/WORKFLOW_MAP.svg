<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" style="width:100%;height:auto;display:block;margin:0 auto" role="img" aria-labelledby="title desc">
  <title id="title">Human-gated research agent workflow</title>
  <desc id="desc">A three-lane workflow showing human decisions, agent execution, and durable project records from project definition through review and the next-task decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f7182"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f3344" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 500 38px Arial, sans-serif; fill: #183247; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #536777; }
      .lane-title { font: 500 22px Arial, sans-serif; fill: #183247; letter-spacing: .4px; }
      .node-title { font: 500 22px Arial, sans-serif; fill: #183247; text-anchor: middle; }
      .node-copy { font: 400 18px Arial, sans-serif; fill: #334b5d; text-anchor: middle; }
      .edge-label { font: 500 17px Arial, sans-serif; fill: #40576a; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 8px; stroke-linejoin: round; }
      .small { font: 400 16px Arial, sans-serif; fill: #536777; }
      .flow { fill: none; stroke: #5f7182; stroke-width: 3; marker-end: url(#arrow); }
      .return { fill: none; stroke: #6f8191; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .human { fill: #eaf1f8; stroke: #355c7d; stroke-width: 3; }
      .agent { fill: #f4f7fa; stroke: #6b7f91; stroke-width: 3; }
      .record { fill: #ffffff; stroke: #8a98a5; stroke-width: 3; }
      .decision { fill: #ffffff; stroke: #647789; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="#ffffff"/>
  <text class="title" x="70" y="62">Human-gated research workflow</text>
  <text class="subtitle" x="70" y="96">One active task, bounded agent loops, explicit human gates, and durable state</text>

  <rect x="40" y="130" width="1720" height="265" rx="18" fill="#f5f8fb"/>
  <rect x="40" y="415" width="1720" height="300" rx="18" fill="#fafbfd"/>
  <rect x="40" y="735" width="1720" height="405" rx="18" fill="#ffffff" stroke="#d8e0e7" stroke-width="2"/>
  <text class="lane-title" x="72" y="170">HUMAN DECISIONS</text>
  <text class="lane-title" x="72" y="455">AGENT EXECUTION</text>
  <text class="lane-title" x="72" y="775">DURABLE RECORDS</text>

  <!-- Human lane -->
  <g filter="url(#shadow)">
    <rect class="human" x="120" y="220" width="250" height="105" rx="52"/>
    <text class="node-title" x="245" y="260"><tspan x="245">Human defines the</tspan><tspan x="245" dy="29">research question</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <polygon class="human" points="570,205 690,272 570,339 450,272"/>
    <text class="node-title" x="570" y="254"><tspan x="570">Gate 1</tspan><tspan class="node-copy" x="570" dy="27">authorize one</tspan><tspan class="node-copy" x="570" dy="24">bounded task</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <polygon class="human" points="1050,205 1175,272 1050,339 925,272"/>
    <text class="node-title" x="1050" y="247"><tspan x="1050">Gate 2</tspan><tspan class="node-copy" x="1050" dy="27">resolve blocker</tspan><tspan class="node-copy" x="1050" dy="24">or scope change</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <polygon class="human" points="1450,205 1575,272 1450,339 1325,272"/>
    <text class="node-title" x="1450" y="247"><tspan x="1450">Gate 3</tspan><tspan class="node-copy" x="1450" dy="27">choose scientific</tspan><tspan class="node-copy" x="1450" dy="24">disposition</tspan></text>
  </g>

  <!-- Agent lane -->
  <g filter="url(#shadow)">
    <rect class="agent" x="515" y="510" width="270" height="115" rx="16"/>
    <text class="node-title" x="650" y="550"><tspan x="650">Agent loop</tspan><tspan class="node-copy" x="650" dy="30">implement → check → repair</tspan><tspan class="node-copy" x="650" dy="25">inside the approved task</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <polygon class="decision" points="980,485 1100,567 980,649 860,567"/>
    <text class="node-title" x="980" y="550"><tspan x="980">Unexpected</tspan><tspan x="980" dy="29">finding?</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <rect class="agent" x="1320" y="510" width="260" height="115" rx="16"/>
    <text class="node-title" x="1450" y="550"><tspan x="1450">Save evidence</tspan><tspan class="node-copy" x="1450" dy="30">facts · checks · limits</tspan><tspan class="node-copy" x="1450" dy="25">prepare review packet</tspan></text>
  </g>

  <!-- Records lane -->
  <g filter="url(#shadow)">
    <rect class="record" x="150" y="830" width="260" height="115" rx="14"/>
    <text class="node-title" x="280" y="868"><tspan x="280">PROJECT.md + PLAN.md</tspan><tspan class="node-copy" x="280" dy="30">purpose · boundaries</tspan><tspan class="node-copy" x="280" dy="25">approved sequence</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <rect class="record" x="515" y="830" width="270" height="115" rx="14"/>
    <text class="node-title" x="650" y="868"><tspan x="650">ACTIVE_TASK.md</tspan><tspan class="node-copy" x="650" dy="30">the only active</tspan><tspan class="node-copy" x="650" dy="25">execution scope</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <rect class="record" x="865" y="830" width="240" height="115" rx="14"/>
    <text class="node-title" x="985" y="868"><tspan x="985">BACKLOG.md</tspan><tspan class="node-copy" x="985" dy="30">record useful idea</tspan><tspan class="node-copy" x="985" dy="25">do not change task</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <rect class="record" x="1215" y="830" width="275" height="115" rx="14"/>
    <text class="node-title" x="1352" y="868"><tspan x="1352">DECISIONS + CURRENT</tspan><tspan class="node-copy" x="1352" dy="30">record disposition</tspan><tspan class="node-copy" x="1352" dy="25">and next state</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <polygon class="decision" points="1600,805 1715,887 1600,969 1485,887"/>
    <text class="node-title" x="1600" y="870"><tspan x="1600">Another</tspan><tspan x="1600" dy="29">approved task?</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <rect class="record" x="1480" y="1030" width="240" height="78" rx="39"/>
    <text class="node-title" x="1600" y="1077">Wait with state preserved</text>
  </g>

  <!-- Primary path -->
  <path class="flow" d="M245 325 V760 H280 V830"/>
  <path class="flow" d="M410 887 H445 V272 H450"/>
  <path class="flow" d="M570 339 V790 H650 V830"/>
  <path class="flow" d="M650 830 V625"/>
  <path class="flow" d="M785 567 H860"/>
  <path class="flow" d="M1100 567 H1320"/>
  <path class="flow" d="M1450 510 V339"/>
  <path class="flow" d="M1575 272 H1645 V755 H1352 V830"/>
  <path class="flow" d="M1490 887 H1485"/>
  <path class="flow" d="M1600 969 V1030"/>

  <!-- Exception paths -->
  <path class="return" d="M930 515 C850 430 760 430 700 510"/>
  <text class="edge-label" x="810" y="446">bounded mechanical fix</text>

  <path class="flow" d="M980 649 V830"/>
  <text class="edge-label" x="1060" y="742">useful later</text>
  <path class="return" d="M865 888 H820 V680 H700 V625"/>
  <text class="edge-label" x="790" y="707">return to original task</text>

  <path class="flow" d="M1015 492 V390 H1050 V339"/>
  <text class="edge-label" x="1140" y="412">blocking or out of scope</text>
  <path class="return" d="M925 272 H820 V470 H700 V510"/>
  <text class="edge-label" x="820" y="300">continue</text>
  <path class="return" d="M1050 205 V160 H570 V205"/>
  <text class="edge-label" x="810" y="151">amend task</text>
  <path class="return" d="M1175 272 H1640 V470 H1510 V510"/>
  <text class="edge-label" x="1615" y="445">stop or invalidate</text>

  <path class="return" d="M1600 805 V740 H1750 V150 H570 V205"/>
  <text class="edge-label" x="1665" y="725">yes · authorize next task</text>

  <!-- Edge labels and legend -->
  <text class="edge-label" x="1190" y="548">no</text>
  <text class="edge-label" x="1660" y="1005">no</text>
  <g transform="translate(70 1165)">
    <rect x="0" y="-19" width="26" height="18" rx="4" class="human"/>
    <text class="small" x="38" y="-4">human-controlled gate</text>
    <rect x="265" y="-19" width="26" height="18" rx="4" class="agent"/>
    <text class="small" x="303" y="-4">agent or review work</text>
    <rect x="545" y="-19" width="26" height="18" rx="4" class="record"/>
    <text class="small" x="583" y="-4">authoritative project record</text>
    <line x1="900" y1="-10" x2="955" y2="-10" class="return"/>
    <text class="small" x="970" y="-4">return or exception route</text>
  </g>
</svg>
